<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Sistema Integrado de Manuais</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/lib/jszip.min.js"></script>
  <script src="js/lib/FileSaver.min.js"></script>
  <script src="js/data_pt.js"></script>
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <!-- Tela de carregamento inicial -->
  <div id="initial-loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <p>Iniciando sistema...</p>
    </div>
  </div>
  <button class="hamburger" id="hamburger-btn">
	  <span></span>
	  <span></span>
	  <span></span>
  </button>

  <!-- resto do layout -->
  <div class="container" style="display:none;">
    <aside class="sidebar">
	  <button id="add-content-btn">+ Adicionar Conteúdo</button>
	  <button id="export-json-btn" style="display: none">Exportar Dados</button>
      <nav id="menu"></nav>

    </aside>
	<main class="content">
	  <div class="search-bar-container">
		<input type="text" id="search-input" class="search-bar" placeholder="Buscar conteúdo...">
		<ul id="search-suggestions" class="search-suggestions" style="display: none;"></ul>
	  </div>

	  <article id="article-content">
		<h1>Bem-vindo</h1>
		<a id="edit-article-link" href="#" style="display:none;" data-categoria="" data-id="">Editar</a>
		<p>Selecione um item no menu para ver o conteúdo.</p>
	  </article>

	  <!-- Overlay deve vir antes do painel -->
	  <div id="overlay"></div>

	  <section id="new-content-panel" style="display: none;">
		<div id="local-image-fix-panel"></div>
		<button id="close-panel-btn" title="Fechar">×</button>
		<h2>Adicionar Conteúdo</h2>

		<label for="category-select">Categoria existente:</label>
		<select id="category-select">
		  <option value="">-- Nova Categoria --</option>
		</select>

		<div id="new-category-wrapper">
		  <label for="new-category">Ou nova categoria:</label>
		  <input type="text" id="new-category" placeholder="Nova categoria" />
		</div>

		<label for="content-title">Título:</label>
		<input type="text" id="content-title" placeholder="Título do conteúdo" />


		<label for="content-body">Conteúdo:</label>
		<div id="content-body" contenteditable="true" data-placeholder="Digite ou cole o conteúdo aqui"></div>
		<div class="editor-toolbar-fixed">
		  	<button class="cmd-btn" data-cmd="bold" title="Negrito"><b>B</b></button>
			<button class="cmd-btn" data-cmd="italic" title="Itálico"><i>I</i></button>
			<button class="cmd-btn" data-cmd="underline" title="Sublinhado"><u>U</u></button>
			<button class="cmd-btn" data-cmd="strikeThrough" title="Tachado"><s>S</s></button>
		  <span class="sep"></span>
		  	<button class="cmd-btn" data-cmd="justifyLeft" title="Esquerda">⯇</button>
			<button class="cmd-btn" data-cmd="justifyCenter" title="Centro">≡</button>
			<button class="cmd-btn" data-cmd="justifyRight" title="Direita">⯈</button>
		  <span class="sep"></span>
		  	<button class="cmd-btn" data-cmd="insertOrderedList" title="Lista numerada">1.</button>
			<button class="cmd-btn" data-cmd="insertUnorderedList" title="Lista">•</button>
			<button class="cmd-btn" data-cmd="formatBlock" data-value="h2" title="Título H2">H2</button>
			<button class="cmd-btn" data-cmd="removeFormat" title="Limpar">⨉</button>
		  <span class="sep"></span>
			<button class="cmd-btn" data-cmd="createLink" title="Link">🔗</button>
			<button class="cmd-btn" data-cmd="insertImage" title="Imagem">🖼️</button>
		  <span class="sep"></span>
		  <button class="cmd-btn" data-cmd="openDebug" title="HTML">{"</>"}</button>
		  <button class="save-button">Salvar</button>
		</div>
	  </section>
		
	</main>
  </div>
  <div id="image-splash" style="display:none;">
    <img id="splash-img" src="" alt="Imagem ampliada">
  </div>
  <div id="debug-popup" class="debug-popup" style="display:none;">
	  <div class="debug-popup-content">
		<button class="close-debug-btn">×</button>
		<div class="debug-columns">
		  <div class="debug-editor">
			<h3>HTML</h3>
			<textarea id="debug-code"></textarea>
		  </div>
		  <div class="debug-preview">
			<h3>Visualização</h3>
			<iframe id="debug-preview-frame"></iframe>
		  </div>
		</div>
		<button class="apply-debug">Aplicar</button>
	  </div>
	</div>
</body>
</html>
