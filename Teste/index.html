<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Posts & Images - Demo</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main>
    <h1>Posts & Images</h1>

    <section id="auth">
      <h2>Usuário</h2>
      <div id="auth-state">Não autenticado</div>
      <button id="signout" style="display:none">Sair</button>
    </section>

    <section id="create-post">
      <h2>Criar Post</h2>
      <input id="title" placeholder="Título" />
      <textarea id="content" placeholder="Conteúdo"></textarea>
      <input id="file" type="file" accept="image/*" />
      <button id="createBtn">Criar post (com imagem)</button>
      <div id="create-status"></div>
    </section>

    <section id="posts-list">
      <h2>Posts</h2>
      <div id="posts"></div>
      <button id="refresh">Atualizar</button>
    </section>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
